<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مشاهدة الحلقة - AnimeLuther</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --surface: #131c31;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #3b82f6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; }

    header {
      background: rgba(11, 15, 25, 0.95); border-bottom: 1px solid var(--border);
      height: 60px; padding: 0 20px; display: flex; align-items: center;
    }
    .nav-wrap {
      max-width: 1240px; width: 100%; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
    }
    .brand { font-size: 1.4rem; font-weight: 800; color: #fff; text-decoration: none; }
    .brand span { color: var(--accent); }
    .back-btn {
      color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 700;
      background: var(--surface); padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border);
    }
    .back-btn:hover { color: #fff; border-color: var(--accent); }

    .container { max-width: 1240px; margin: 22px auto; padding: 0 20px; }

    .title-bar {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
      gap: 12px; margin-bottom: 16px;
    }
    .title-bar h1 { font-size: 1.35rem; font-weight: 800; }
    .ep-pill {
      background: var(--accent); color: #fff; font-weight: 800; font-size: 0.9rem;
      padding: 4px 14px; border-radius: 8px;
    }

    .player-box {
      position: relative; width: 100%; aspect-ratio: 16/9;
      background: #000; border-radius: 14px; overflow: hidden;
      border: 1px solid var(--border); box-shadow: 0 16px 36px rgba(0,0,0,0.6);
    }
    .player-box video, .player-box iframe {
      width: 100%; height: 100%; border: none; display: block;
    }

    .panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 18px; margin-top: 18px;
    }
    .panel-title { font-size: 0.95rem; font-weight: 700; color: var(--text-muted); margin-bottom: 10px; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .btn-row:last-child { margin-bottom: 0; }

    .chip {
      background: #1e293b; color: #e2e8f0; border: 1px solid rgba(255,255,255,0.1);
      padding: 7px 14px; border-radius: 8px; font-size: 0.88rem; font-weight: 700;
      cursor: pointer; transition: 0.18s;
    }
    .chip:hover { background: #334155; }
    .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .anime-desc {
      margin-top: 18px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 18px; display: flex; gap: 18px; align-items: flex-start;
    }
    .anime-desc img { width: 110px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
    .desc-text h3 { font-size: 1.1rem; margin-bottom: 6px; }
    .desc-text p { font-size: 0.88rem; color: var(--text-muted); line-height: 1.6; }

    @media (max-width: 640px) {
      .anime-desc { flex-direction: column; align-items: center; text-align: center; }
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-wrap">
      <a href="/" class="brand">Anime<span>Luther</span></a>
      <a href="/" class="back-btn">العودة للرئيسية</a>
    </div>
  </header>

  <div class="container">
    <div class="title-bar">
      <h1 id="animeTitle">جاري تحميل الأنمي...</h1>
      <span class="ep-pill" id="epLabel">الحلقة 1</span>
    </div>

    <!-- حاوية ديناميكية تدعم الـ Video المباشر أو الـ Iframe حسب السيرفر -->
    <div class="player-box" id="playerContainer">
      <iframe id="playerFrame" src="" allowfullscreen allow="autoplay; fullscreen; encrypted-media"></iframe>
    </div>

    <div class="panel">
      <div class="panel-title">تبديل السيرفر:</div>
      <div class="btn-row" id="serversRow"></div>

      <div class="panel-title">الحلقات:</div>
      <div class="btn-row" id="episodesRow"></div>
    </div>

    <div class="anime-desc" id="infoCard" style="display:none;">
      <img id="coverImg" src="" alt="Cover">
      <div class="desc-text">
        <h3 id="subTitle"></h3>
        <p id="synopsis"></p>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const anilistId = params.get('anilistId') || '11061';
    let currentEp = parseInt(params.get('ep') || '1', 10);
    const container = document.getElementById('playerContainer');

    const servers = [
      { 
        name: 'MegaPlay (مترجم)', 
        type: 'iframe', 
        getUrl: (id, ep) => `https://megaplay.xyz/embed/anime/${id}/${ep}` 
      },
      { 
        name: 'MegaPlay (مدبلج)', 
        type: 'iframe', 
        getUrl: (id, ep) => `https://megaplay.xyz/embed/anime/${id}/${ep}/dub` 
      },
      { 
        name: 'Animex Server', 
        type: 'iframe', 
        getUrl: (id, ep) => `https://animex.one/embed/${id}/${ep}` 
      },
      { 
        name: 'VidSrc الاحتياطي', 
        type: 'iframe', 
        getUrl: (id, ep) => `https://vidsrc.cc/v2/embed/anime/${anilistId}/${ep}` 
      }
    ];

    async function loadAnimeDetails() {
      try {
        const res = await fetch(`/api/anilist/info?anilistId=${anilistId}`);
        const data = await res.json();
        const info = data?.resolved?.info;
        if (info) {
          const mainName = info.title?.english || info.title?.romaji || 'Anime';
          document.getElementById('animeTitle').textContent = mainName;
          document.title = `${mainName} - الحلقة ${currentEp}`;

          document.getElementById('infoCard').style.display = 'flex';
          document.getElementById('coverImg').src = info.coverImage?.large || '';
          document.getElementById('subTitle').textContent = info.title?.romaji || mainName;
          document.getElementById('synopsis').textContent = (info.description || '').replace(/<[^>]+>/g, '');

          buildEpisodeButtons(info.episodes || 24);
        } else {
          buildEpisodeButtons(24);
        }
      } catch (e) {
        buildEpisodeButtons(24);
      }
      loadServer(0);
    }

    function buildEpisodeButtons(count) {
      const row = document.getElementById('episodesRow');
      let html = '';
      for (let i = 1; i <= count; i++) {
        html += `<button class="chip ${i === currentEp ? 'active' : ''}" onclick="changeEpisode(${i})">${i}</button>`;
      }
      row.innerHTML = html;
    }

    function changeEpisode(ep) {
      currentEp = ep;
      document.getElementById('epLabel').textContent = `الحلقة ${ep}`;
      document.querySelectorAll('#episodesRow .chip').forEach((btn, idx) => {
        btn.classList.toggle('active', idx + 1 === ep);
      });
      const activeServerBtn = document.querySelector('#serversRow .chip.active');
      const serverIdx = activeServerBtn ? parseInt(activeServerBtn.dataset.index, 10) : 0;
      loadServer(serverIdx);
    }

    function loadServer(index) {
      const srv = servers[index] || servers[0];
      
      if (srv.type === 'iframe') {
        container.innerHTML = `<iframe id="playerFrame" src="${srv.getUrl(anilistId, currentEp)}" allowfullscreen allow="autoplay; fullscreen; encrypted-media"></iframe>`;
      }

      const rows = document.getElementById('serversRow');
      rows.innerHTML = servers.map((s, i) => `
        <button class="chip ${i === index ? 'active' : ''}" data-index="${i}" onclick="loadServer(${i})">${s.name}</button>
      `).join('');
    }

    loadAnimeDetails();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnimeLuther - بوابتك لعالم الأنمي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --surface: #131c31;
      --surface-hover: #1a2642;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: var(--bg); color: var(--text); overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; }

    /* Compact, Clean Sticky Header */
    header {
      position: sticky; top: 0; z-index: 1000;
      background: rgba(11, 15, 25, 0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      height: 62px; padding: 0 20px; display: flex; align-items: center;
    }
    .nav-wrap {
      max-width: 1380px; width: 100%; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .brand { font-size: 1.45rem; font-weight: 800; color: #fff; text-decoration: none; letter-spacing: -0.5px; display: flex; align-items: center; gap: 6px; }
    .brand span { color: var(--accent); }

    .nav-tabs { display: flex; align-items: center; gap: 8px; }
    .nav-btn {
      background: transparent; border: none; color: var(--text-muted);
      padding: 6px 14px; border-radius: 8px; font-size: 0.92rem; font-weight: 700;
      cursor: pointer; transition: 0.2s;
    }
    .nav-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }
    .nav-btn.active { color: #fff; background: var(--accent); }

    .search-wrap {
      display: flex; align-items: center; background: var(--surface);
      border: 1px solid var(--border); border-radius: 10px; padding: 5px 12px;
      transition: border-color 0.2s;
    }
    .search-wrap:focus-within { border-color: var(--accent); }
    .search-wrap input {
      background: transparent; border: none; color: #fff; outline: none;
      width: 210px; font-size: 0.9rem; padding-right: 6px;
    }

    /* Main Content */
    main { max-width: 1380px; width: 100%; margin: 24px auto; padding: 0 20px; flex: 1; }
    .section-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 18px; border-right: 4px solid var(--accent); padding-right: 12px;
    }
    .section-head h2 { font-size: 1.25rem; font-weight: 800; }

    /* Responsive Anime Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 18px;
    }
    .card {
      background: var(--surface); border-radius: 12px; overflow: hidden;
      border: 1px solid var(--border); text-decoration: none; color: inherit;
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
      display: flex; flex-direction: column;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
      border-color: var(--accent);
    }
    .poster { position: relative; width: 100%; aspect-ratio: 2/3; background: #1e293b; overflow: hidden; }
    .poster img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.35s ease; }
    .card:hover .poster img { transform: scale(1.04); }
    .tag-type {
      position: absolute; top: 8px; right: 8px; background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px); color: #fff; font-size: 0.72rem; font-weight: 700;
      padding: 2px 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.12);
    }
    .tag-score {
      position: absolute; bottom: 8px; left: 8px; background: rgba(59, 130, 246, 0.92);
      color: #fff; font-size: 0.75rem; font-weight: 800; padding: 2px 7px; border-radius: 6px;
    }
    .card-body { padding: 11px 12px; }
    .card-title {
      font-size: 0.94rem; font-weight: 700; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px;
    }
    .card-sub { font-size: 0.78rem; color: var(--text-muted); display: flex; justify-content: space-between; }

    .loader { text-align: center; padding: 50px; color: var(--text-muted); font-size: 1.05rem; grid-column: 1 / -1; }

    footer {
      border-top: 1px solid var(--border); padding: 18px 20px; text-align: center;
      color: var(--text-muted); font-size: 0.85rem; margin-top: 40px;
    }

    @media (max-width: 768px) {
      .nav-tabs { display: none; }
      .search-wrap input { width: 150px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-wrap">
      <a href="/" class="brand">Anime<span>Luther</span></a>
      <div class="nav-tabs">
        <button class="nav-btn active" onclick="switchTab(this, 'TRENDING_DESC', 'الأكثر رواجاً الآن')">الرئيسية</button>
        <button class="nav-btn" onclick="switchTab(this, 'POPULARITY_DESC', 'الأكثر شعبية')">الأعلى شعبية</button>
        <button class="nav-btn" onclick="switchTab(this, 'SCORE_DESC', 'الأعلى تقييماً')">الأعلى تقييماً</button>
      </div>
      <div class="search-wrap">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="ابحث عن أنمي..." oninput="onSearch(this.value)">
      </div>
    </div>
  </header>

  <main>
    <div class="section-head">
      <h2 id="feedTitle">الأكثر رواجاً الآن</h2>
    </div>
    <div class="grid" id="animeGrid">
      <div class="loader">جاري تحميل قائمة الأنمي...</div>
    </div>
  </main>

  <footer>
    AnimeLuther &copy; 2026 - جميع الحقوق محفوظة لأصحابها
  </footer>

  <script>
    const grid = document.getElementById('animeGrid');
    const feedTitle = document.getElementById('feedTitle');
    let timer = null;

    async function fetchAnime(endpoint) {
      grid.innerHTML = '<div class="loader">جاري التحميل...</div>';
      try {
        const res = await fetch(endpoint);
        const data = await res.json();
        const items = data.anilist || data.results || [];
        renderCards(items);
      } catch (err) {
        grid.innerHTML = '<div class="loader">تعذر الاتصال بالسيرفر، يرجى تحديث الصفحة.</div>';
      }
    }

    function renderCards(items) {
      if (!items.length) {
        grid.innerHTML = '<div class="loader">لا توجد نتائج مطابقة لبحثك.</div>';
        return;
      }
      grid.innerHTML = items.map(item => `
        <a href="/watch.html?anilistId=${item.id}" class="card">
          <div class="poster">
            <span class="tag-type">${item.format || 'TV'}</span>
            ${item.score ? `<span class="tag-score">★ ${(item.score / 10).toFixed(1)}</span>` : ''}
            <img src="${item.image}" alt="${item.title}" loading="lazy">
          </div>
          <div class="card-body">
            <div class="card-title" title="${item.title}">${item.title}</div>
            <div class="card-sub">
              <span>${item.year || 'مستمر'}</span>
              <span>${item.episodes ? item.episodes + ' حلقة' : 'غير محدد'}</span>
            </div>
          </div>
        </a>
      `).join('');
    }

    function switchTab(btn, sortType, title) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      feedTitle.textContent = title;
      document.getElementById('searchInput').value = '';
      fetchAnime(`/api/home/recently-released?sort=${sortType}`);
    }

    function onSearch(val) {
      clearTimeout(timer);
      const q = val.trim();
      timer = setTimeout(() => {
        if (q.length >= 2) {
          feedTitle.textContent = `نتائج البحث: ${q}`;
          fetchAnime(`/api/anime/search?q=${encodeURIComponent(q)}`);
        } else if (q.length === 0) {
          feedTitle.textContent = 'الأكثر رواجاً الآن';
          fetchAnime('/api/home/recently-released?sort=TRENDING_DESC');
        }
      }, 400);
    }

    fetchAnime('/api/home/recently-released?sort=TRENDING_DESC');
  </script>
</body>
</html>
